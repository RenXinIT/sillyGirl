name: Build sillyGirl

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build
      run: |
        cd $GITHUB_WORKSPACE
        go build -o sillyGirl -ldflags "-s -w" .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sillyGirl-linux-amd64
        path: sillyGirl
