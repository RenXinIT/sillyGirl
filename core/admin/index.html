<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>傻妞</title>
<link rel="stylesheet" href="/admin/umi.d8ae1311.css">
<script async="" src="/scripts/loading.js"></script>
<style>
body {
    background: #f0f2f5 !important;
    background-attachment: fixed !important;
}

.ant-pro-form-login-header,
.ant-pro-form-login-logo,
.ant-pro-form-login-title,
.ant-pro-form-login-desc {
    display: none !important;
}

.ant-pro-form-login-container .ant-tabs-nav {
    display: none !important;
}

.ant-pro-form-login-main-other {
    display: none !important;
}

.ant-pro-form-login-container a[href*="forgot"],
.ant-pro-form-login-container a[href*="reset"] {
    display: none !important;
}

.ant-layout-footer {
    display: none !important;
}

.ant-pro-form-login-container {
    position: fixed !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 90% !important;
    max-width: 400px !important;
    height: auto !important;
    min-height: auto !important;
    max-height: 90vh !important;
    padding: 40px 36px !important;
    margin: 0 !important;
    background: #fff !important;
    border-radius: 16px !important;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1) !important;
    overflow: hidden !important;
}

.ant-pro-form-login-container::before {
    content: "登录后台";
    display: block;
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    color: #333;
    margin-bottom: 28px;
    letter-spacing: 2px;
}

.ant-pro-form-login-main .ant-input-affix-wrapper,
.ant-pro-form-login-main .ant-input {
    border-radius: 8px !important;
    height: 42px !important;
    border: 1px solid #dcdfe6 !important;
    background: #fff !important;
}

.ant-pro-form-login-main .ant-input-affix-wrapper:focus-within,
.ant-pro-form-login-main .ant-input:focus {
    border-color: #409eff !important;
    box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.1) !important;
}

.ant-pro-form-login-main .ant-btn-primary {
    border-radius: 8px !important;
    height: 42px !important;
    font-weight: 600 !important;
    font-size: 15px !important;
    background: #409eff !important;
    border: none !important;
    box-shadow: 0 4px 12px rgba(64, 158, 255, 0.3) !important;
}

.ant-pro-form-login-main .ant-btn-primary:hover {
    background: #66b1ff !important;
    box-shadow: 0 6px 16px rgba(64, 158, 255, 0.4) !important;
}

.ant-pro-form-login-main .ant-checkbox-checked .ant-checkbox-inner {
    background-color: #409eff !important;
    border-color: #409eff !important;
}
</style>
</head>
<body>
<div id="root"></div>
<script src="/admin/umi.a85b5822.js"></script>

<script>
/* 404 自动跳转 */
(function() {
    var fixed = false;
    var count = 0;
    var timer = setInterval(function() {
        if (fixed || count > 50) { clearInterval(timer); return; }
        count++;
        var text = (document.body && document.body.innerText) ? document.body.innerText : '';
        if (text.indexOf('does not exist') === -1 && text.indexOf('404') === -1) return;
        var all = document.querySelectorAll('button, a');
        for (var i = 0; i < all.length; i++) {
            var t = (all[i].innerText || '').trim();
            if (t === 'Back Home' || t === '返回首页' || t.indexOf('Back Home') !== -1) {
                fixed = true;
                all[i].click();
                return;
            }
        }
        fixed = true;
        window.location.href = '/admin/';
    }, 300);
})();

/* 替换后台标题 */
(function() {
    var oldText = '傻妞科技研究生产中心';
    var newText = '控制后台';  // 改成你想要的名字

    function replaceTitle() {
        var all = document.querySelectorAll('h1, h2, h3, h4, h5, span, div, a');
        for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (el.children.length === 0 && el.textContent.trim() === oldText) {
                el.textContent = newText;
                return true;
            }
        }
        return false;
    }

    var count = 0;
    var timer = setInterval(function() {
        if (replaceTitle() || count > 100) clearInterval(timer);
        count++;
    }, 200);

    if (window.MutationObserver) {
        var observer = new MutationObserver(function() {
            replaceTitle();
        });
        observer.observe(document.body, { childList: true, subtree: true });
    }
})();
</script>
</body>
</html>
